name: Building eBPF

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      
    - uses: dtolnay/rust-toolchain@nightly
      with:
          targets: bpfel-unknown-none
          components: rust-src
    - name: Build eBPF
      run: cargo build --manifest-path phage-agent/phage-agent-ebpf/Cargo.toml --target bpfel-unknown-none -Z build-std=core --release
    - name: Build eBPF builder
      run: cargo build --release --bin phage-agent -p phage-agent
